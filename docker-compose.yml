services:
  db:
    image: postgres:16
    container_name: villacollective-db
    restart: unless-stopped
    # Durability is traded for speed: this is a disposable local dev/test DB,
    # and fsync-bound COMMITs dominate the (write-heavy, parallel) test suite.
    # An unclean crash can corrupt the data dir — rebuild with `migrate` +
    # `seed_dev`. Never use these flags on a database you can't recreate.
    command: >-
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    environment:
      POSTGRES_USER: villa
      POSTGRES_PASSWORD: villa
      POSTGRES_DB: villacollective
    ports:
      - "55432:5432"
    volumes:
      - villa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U villa -d villacollective"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Celery broker. Matches the default CELERY_BROKER_URL
  # (redis://localhost:6379/0) so `celery -A villacollective worker/beat` works
  # with no extra config. Disposable — no volume; a restart just drops queued
  # jobs, which the `requeue_stuck_emails` sweep recovers from in prod anyway.
  redis:
    image: redis:7
    container_name: villacollective-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  villa_pgdata:
