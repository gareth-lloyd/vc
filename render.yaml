databases:
  - name: villacollective-db
    plan: basic-256mb
    databaseName: villacollective
    user: villacollective
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # Single service: Django serves the REST API and the built SPA from one
  # origin (Docker multi-stage build). No separate static site, no CORS.
  - type: web
    name: villacollective-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    branch: main
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: villacollective-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: villacollective.settings.staging
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: https://villacollective-api.onrender.com
