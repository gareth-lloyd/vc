# Villa image generation manifest — single source of truth for the
# `generate_seed_images` management command AND for manifest-coherent property
# seeding (`seed_dev`). Edit this to expand or re-roll the dev/staging pool,
# then re-run the command.
#
# Each entry produces four JPEGs under villa_<slug>/: hero, interior,
# exterior, gallery. A shared style preamble (defined in the command, not
# here) is prepended to every prompt so the 80 images stay stylistically
# coherent without boilerplate in each line. The four prompt keys map 1:1 to
# the generated filenames and to the seeded `ImageKind` values.
#
# Seeding (`core/seed/stages/properties.py`) cycles these entries, exhausting
# every villa before repeating, and builds each property from the entry:
#   display_name  -> Property.display_name
#   location_tag  -> Region name / locality (text before the last comma)
#   country_iso2  -> Country (reuses the migration-seeded ISO-3166 row)
#   style_anchor  -> PropertyDescription body
#   <slug>/*.jpg  -> PropertyImage rows
#
# Slugs must stay filesystem-safe (used as directory names) and stable.
# country_iso2 must be a seeded ISO-3166 alpha-2 code (properties.0009).

- slug: villa_01_amalfi
  display_name: Villa Amalfi
  location_tag: "Amalfi Coast, Italy"
  country_iso2: IT
  style_anchor: >
    Mediterranean cliff-edge villa, whitewashed walls, terracotta roof,
    lemon trees, infinity pool overlooking the Tyrrhenian Sea.
  prompts:
    hero: "Wide exterior at golden hour, cypress-lined drive, sea beyond the pool."
    interior: "Sun-drenched open-plan living room with linen sofas and arched windows."
    exterior: "Infinity pool deck with sun loungers and a sweeping sea view."
