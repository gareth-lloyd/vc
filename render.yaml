databases:
  - name: villacollective-db
    plan: basic-256mb
    databaseName: villacollective
    user: villacollective
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: villacollective-api
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: django_res
    autoDeploy: true
    branch: main
    buildCommand: pip install uv && uv sync --frozen
    preDeployCommand: uv run python manage.py migrate --noinput
    startCommand: uv run gunicorn villacollective.wsgi:application --bind 0.0.0.0:$PORT --workers $WEB_CONCURRENCY
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: villacollective-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: villacollective.settings.production
      - key: PYTHON_VERSION
        value: "3.13"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: villacollective-web
    runtime: static
    rootDir: frontend
    autoDeploy: true
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://villacollective-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
