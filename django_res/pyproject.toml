[project]
name = "villacollective"
version = "0.1.0"
description = "Villa Collective reservation system — Django REST API"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "whitenoise>=6.8",
    "django-environ>=0.12",
    "django-filter>=25.2",
    "pyotp>=2.9.0",
    "cryptography>=48.0.0",
    "pillow>=12.2.0",
    "pymssql>=2.3.13",
    "django-countries>=8.2.0",
    "mjml>=0.12.0",
    "openai>=2.38.0",
    "pyyaml>=6.0.3",
    "markdown>=3.10.2",
    # iCal feed ingest (GAP-011): fetch per-villa .ics calendars (httpx), parse
    # them (icalendar) and expand recurrences (recurring-ical-events) into
    # owner-availability blocks.
    "httpx>=0.28",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    # zoneinfo's IANA database. The deploy image (python:3.13-slim) ships no
    # system /usr/share/zoneinfo, so ZoneInfo(...) would raise on Linux without
    # this. Unconditional (not the win32-marked transitive dep) — see FG-008.
    "tzdata>=2025.1",
    "html2text>=2025.4.15",
    "phonenumbers>=9.0.32",
    "django-structlog>=8.0",
    # Async task queue + periodic (beat) scheduler. Redis is the broker (see
    # docker-compose `redis` locally; Render Key Value in prod). No result
    # backend — tasks are fire-and-forget (CELERY_TASK_IGNORE_RESULT=True).
    "celery[redis]>=5.4",
    "django-storages[s3]>=1.14.6",
    # Runtime (not dev-only): staging runs `seed_dev`, which drives the
    # factory-boy builders.
    "factory-boy>=3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "types-markdown>=3.10.2.20260518",
    "import-linter>=2.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.22",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "DJ",           # django
    "RUF",          # ruff-specific
    "TID251",       # flake8-tidy-imports: banned-api (see banned-api below)
]
ignore = [
    # RUF012 fires on Django Meta-class attributes (constraints/indexes/ordering)
    # which are standard idiomatic Django and not mutable in any meaningful way.
    "RUF012",
    # DJ008 demands every Model define __str__; harmless to skip on append-only
    # / system-only models that never appear in admin lists.
    "DJ008",
    # DJ001 (no null on CharField) — legacy_id and similar optional CharFields
    # are deliberately nullable in this design to distinguish "not yet set"
    # from "explicitly blank" without re-introducing a sentinel string.
    "DJ001",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Logging is structlog end to end (see django_res/CLAUDE.md §"Structured
# logging"). stdlib `logging.getLogger` still renders through the pipeline but
# bypasses the event-style convention, so ban it: use `structlog.get_logger`.
"logging.getLogger".msg = "Use structlog.get_logger(__name__), not logging.getLogger — see django_res/CLAUDE.md §Structured logging."

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]
# core/logging/config.py legitimately wires stdlib logging (the LOGGING dict);
# it references logging internals by design.
"core/logging/config.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "villacollective.settings.test"

[tool.pyright]
# Editor/ad-hoc type checker. The enforced type gate is mypy + django-stubs
# (pre-commit + CI). pyright has no Django plugin, so it cannot see dynamically
# synthesised ORM attributes (reverse relations, FK `_id` shadows, related
# managers); those few residual errors are expected and covered by mypy.
venvPath = "."        # relative to this file → django_res/
venv = ".venv"        # → django_res/.venv, the uv-managed env with django-stubs
pythonVersion = "3.13"
exclude = ["**/migrations"]   # parity with mypy's migrations exclude

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "villacollective.settings.test"
python_files = ["test_*.py", "tests.py"]
# `-n auto`: run in parallel across cores (pytest-xdist), default `load`
# distribution — tests stream to whichever worker is free, which balances the
# heavy `seeding/` tests across cores (measurably faster than `loadscope` here,
# and the suite has no module/session-scoped fixtures that would need pinning).
# pytest-django gives each worker its own `test_villacollective_gw{n}` DB, so
# isolation is identical to serial. For the single-test TDD inner loop, pass
# `-n0` to run serially with readable output and clean `-x` behaviour.
addopts = "-ra --strict-markers --reuse-db -n auto"

# ---------------------------------------------------------------------------
# import-linter — the horizontal (app-to-app) layering contract.
#
# The vertical layering (view → service → model) is enforced by directory
# structure; this enforces the *horizontal* DAG that was previously unwritten.
# Run with `uv run lint-imports`; wired into pre-commit and CI alongside mypy.
# ---------------------------------------------------------------------------
[tool.importlinter]
# Needed by the "services are framework-free" forbidden contract below, whose
# forbidden module (`rest_framework`) is an external package.
include_external_packages = true
root_packages = [
    "core",
    "accounts",
    "properties",
    "owners",
    "pricing",
    "reservations",
    "payments",
    "comms",
    "integrations",
    "seeding",
    "data_migration",
]

[[tool.importlinter.contracts]]
name = "core is the foundation — it imports no domain app"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "accounts",
    "properties",
    "pricing",
    "reservations",
    "payments",
    "comms",
    "integrations",
    "seeding",
    "data_migration",
]
# Test scaffolding may reach anywhere; the contract governs runtime code.
ignore_imports = ["core.tests.** -> **"]

[[tool.importlinter.contracts]]
name = "spine layers — imports point down the stack"
type = "layers"
# High → low. A layer may import those below it; a lower layer importing a
# higher one is a violation unless explicitly blessed below.
#
# `integrations` (outbound third-party sync) sits low in the spine: domain
# apps reach *down* into it to enqueue a push (`reservations → integrations`),
# and it reaches further down for the auth identity it syncs against
# (`integrations → accounts`). Both are clean downward edges, so it needs no
# blessed exception — but it MUST be listed, or its position is unconstrained
# and a future upward edge (e.g. `integrations → reservations`) goes uncaught.
#
# `owners` (owner-organisation membership + owner-facing property/booking
# surface) sits below `reservations`: it reads property and account data
# (`owners → properties`, `owners → accounts`), and `reservations` reaches
# *down* into it for owner scoping/permissions (`reservations.views.owner →
# owners`). Clean downward edges, no blessed exception needed — listed so the
# slot is pinned before owner-approval flows grow more edges (FG-013).
layers = [
    "comms",
    "payments",
    "reservations",
    "owners",
    "pricing",
    "properties",
    "integrations",
    "accounts",
]
ignore_imports = [
    # Test scaffolding and migrations may reach across apps freely — the
    # contract governs runtime application code only.
    "*.tests.** -> **",
    "*.migrations.** -> **",
    # --- Blessed runtime back-edges (each a deliberate architectural seam) ---
    # Catalogue availability search: the property-search filter reads booking /
    # hold occupancy to drop unavailable villas. Single lazy, deduped seam that
    # routes through the canonical model predicates (Step 3c).
    "properties.filters.property -> reservations.models.booking",
    # `comms` is the cross-cutting notification sink: domain apps import it to
    # send transactional email / mount its email surface. Blessed in-bound edges:
    "accounts.services.password_reset -> comms.services",
    "reservations.urls -> comms.views",
    "payments.tasks -> comms.enums",
    "payments.tasks -> comms.models",
    "payments.tasks -> comms.exceptions",
    "payments.tasks -> comms.recipients",
    "payments.tasks -> comms.services",
]

[[tool.importlinter.contracts]]
name = "services are framework-free — no rest_framework in the service layer"
type = "forbidden"
# Vertical-architecture rule (django_res/CLAUDE.md §Principles): DRF handles
# (de)serialization in views/serializers only; ALL business logic lives in the
# service layer, which must stay free of the HTTP framework. A service that
# raises `rest_framework.exceptions.ValidationError` couples domain logic to
# DRF and skips the canonical `{code, detail, field_errors}` shape — raise a
# `core.exceptions.DomainError` subclass instead (SMELL-010). Listed per app
# (package + `**` descendants) so a new `<app>/services/` package is a
# deliberate add here, not silently uncovered.
source_modules = [
    "accounts.services",
    "accounts.services.**",
    "integrations.services",
    "integrations.services.**",
    "payments.services",
    "payments.services.**",
    "pricing.services",
    "pricing.services.**",
    "properties.services",
    "properties.services.**",
    "reservations.services",
    "reservations.services.**",
]
forbidden_modules = ["rest_framework"]
# Direct imports only: `core.api.permissions` (the sanctioned service-layer
# `actor_has_perm` primitive) legitimately imports DRF, and services reach it
# downward — that blessed transitive chain is not the coupling we're banning.
allow_indirect_imports = "true"
